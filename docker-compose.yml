services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rozi
      POSTGRES_USER: rozi
      POSTGRES_PASSWORD: rozi-local-password
    ports:
      - "5432:5432"
    volumes:
      - rozi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rozi -d rozi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rozi_postgres_data:
